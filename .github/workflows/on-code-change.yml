# This workflow is triggered every time a change is pushed to any branches
# Github actions command reference: https://docs.github.com/en/actions/learn-github-actions/workflow-syntax-for-github-actions
name: On Code Change (PR)

# The workflow could also be triggered on PRs
on:
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  update-signature:
    name: Update module signature
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: jahia/jahia-modules-action/update-signature@v2
        with:
          nexus_username: ${{ secrets.NEXUS_USERNAME }}
          nexus_password: ${{ secrets.NEXUS_PASSWORD }}
          nexus_enterprise_releases_url: ${{ secrets.NEXUS_ENTERPRISE_RELEASES_URL }}

  static-analysis:
    name: Static Analysis (linting, vulns)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: Jahia/jahia-modules-action/static-analysis@v2
        with:
          node_version: 12
          auditci_level: critical

  build:
    # TEMPORARY. Both legs build this module identically; the only difference is the image the job
    # runs in, so the time to start the container is the cost of the Maven cache it carries.
    # The two run together, on one commit, so the runner and the moment are the same for both.
    #   baseline: what main publishes today
    #   census:   the same image warmed for the 26 versions the census proposes
    # Both are resolute, so the base image is not part of the difference.
    name: Build Module (${{ matrix.label }})
    needs: update-signature
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: baseline
            image: ghcr.io/jahia/jahia-docker-mvn-cache:11-jdk-resolute-mvn-loaded
            suffix: ""
          - label: census
            image: ghcr.io/jahia/jahia-docker-mvn-cache:11-jdk-resolute-mvn-loaded-pr-39
            suffix: "-census"
    container:
      image: ${{ matrix.image }}
      credentials:
        username: ${{ secrets.GH_PACKAGES_USERNAME }}
        password: ${{ secrets.GH_PACKAGES_TOKEN }}
    steps:
      - uses: actions/checkout@v3
      - uses: jahia/jahia-modules-action/build@v2
        with:
          nexus_username: ${{ secrets.NEXUS_USERNAME }}
          nexus_password: ${{ secrets.NEXUS_PASSWORD }}
          module_id: visibility
          # The baseline leg keeps the default name, so the Sonar job below still finds it.
          github_artifact_suffix: ${{ matrix.suffix }}

  sonar-analysis:
    name: Sonar Analysis
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: jahia/jahia-modules-action/sonar-analysis@v2
        with:
          primary_release_branch: main
          github_pr_id: ${{github.event.number}}
          sonar_url: ${{ secrets.SONAR_URL }}
          sonar_token: ${{ secrets.SONAR_TOKEN }}
